<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كويك - تواصل معنا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="stylesheet" href="assets/css/globals.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body>
    <section id="login-section" class="login-section">
      <div class="content d-flex">
        <div
          class="right-section w-100 mt-5"
          data-animate="fadeInRight"
          data-animate-delay="200"
        >
          <div class="login-container">
            <a href="index.html" class="d-flex align-items-center gap-2 mb-5">
              <img
                src="assets/images/company-logo.svg"
                alt="Company Logo"
                loading="lazy"
                class="logo"
                style="width: 11%"
              />
              <span class="title fs-4 clr-primary fw-bold">كويك</span>
            </a>

            <div class="login-header">
              <h2 class="welcome-title">انشاء حساب</h2>
            </div>
            <form class="login-form">
              <div>
                <label
                  for="inputMessage"
                  class="fs-6 fw-medium clr-black-3 mb-2"
                  >الاسم بالكامل *</label
                >
                <input
                  type="text"
                  class="form-control bg-lite border-lite"
                  placeholder="اكتب الاسم بالكامل"
                  required
                />
              </div>
              <div>
                <label
                  for="inputMessage"
                  class="fs-56fw-medium clr-black-3 mb-2"
                  >البريد الالكتروني *</label
                >
                <input
                  type="email"
                  class="form-control bg-lite border-lite"
                  placeholder="اكتب بريدك الالكتروني"
                  required
                />
              </div>
              <div class="position-relative">
                <label
                  for="inputMessage"
                  class="fs65 fw-medium clr-black-3 mb-2"
                  >كلمة السر *</label
                >
                <input
                  type="password"
                  class="form-control bg-lite border-lite"
                  placeholder="اكتب كلمة السر"
                  required
                />
              </div>
              <div class="position-relative">
                <label
                  for="inputMessage"
                  class="fs-6 fw-medium clr-black-3 mb-2"
                  >تأكيد كلمة السر *</label
                >
                <input
                  type="password"
                  class="form-control bg-lite border-lite"
                  placeholder="اكتب تأكيد كلمة السر"
                  required
                />
              </div>

              <button type="submit" class="button primary-btn mt-4">
                انشاء حساب
              </button>
            </form>

            <a
              href="login.html"
              class="d-block text-center mt-3 fs-6 clr-gray-1"
              >لديك حساب ؟ تسجيل الدخول</a
            >
          </div>
        </div>
        <div
          class="left-section w-100"
          data-animate="fadeInLeft"
          data-animate-delay="200"
        >
          <h3
            class="fw-bold text-center clr-black-2"
            style="font-size: 2rem; margin-top: 7rem"
          >
            مرحبا بك !
          </h3>

          <img
            src="assets/images/pic-28.png"
            alt="Pic"
            loading="lazy"
            class="position-absolute top-0 start-0"
            style="width: 12%; z-index: 0"
          />
          <img
            src="assets/images/pic-20.png"
            alt="Pic"
            loading="lazy"
            class="position-absolute top-0 start-0"
            style="width: 30%; z-index: -1"
          />
          <img
            src="assets/images/pic-27.png"
            alt="Home Hero Image"
            loading="lazy"
            class="mt-3 w-100"
          />
        </div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
